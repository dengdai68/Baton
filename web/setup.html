<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>设置工作区 · Baton</title><link rel="stylesheet" href="/login.css"></head>
<body>
  <div class="auth__bar" aria-hidden="true"></div>
  <main class="login-card">
    <img class="login-icon" src="/icons/application-ui.png" width="52" height="52" alt="">
    <h1>设置本机工作区</h1>
    <p class="intro">创建当前客户端工作区的管理员。该一次性入口只由此桌面客户端启动，不会创建公开注册。</p>
    <form id="setup-form">
      <label for="username">管理员用户名</label><input id="username" name="username" autocomplete="username" maxlength="64" aria-describedby="username-hint" required autofocus>
      <p id="username-hint" class="field-hint">1–64 位字母、数字、点、下划线或连字符。</p>
      <label for="password">密码</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="new-password" maxlength="128" aria-describedby="password-hint setup-error" required><button id="toggle-password" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div>
      <p id="password-hint" class="field-hint">10–128 字符。</p>
      <label for="confirmation">确认密码</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" maxlength="128" aria-describedby="setup-error" required>
      <p id="setup-error" role="alert" aria-live="polite"></p>
      <button class="submit" type="submit">创建管理员并进入工作区</button>
    </form>
    <footer><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m12 3 8 4v6c0 5-8 8-8 8s-8-3-8-8V7z"/><path d="m8 12 3 3 5-6"/></svg>本机单管理员 · 安全会话</footer>
  </main>
  <script type="module" src="/setup.js"></script>
</body></html>
