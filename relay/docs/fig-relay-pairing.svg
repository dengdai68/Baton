<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="986" viewBox="0 0 1200 986" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<title>Baton Relay 配对时序</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fd8"/></marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f4e"/></marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c26a12"/></marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="36" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Baton Relay 配对时序（草案 v2）：扫码后全自动，手机与 Mac 端到端验证设备，一次配对 = 一条通道</text><line x1="170" y1="104" x2="170" y2="966" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="60" y="52" width="220" height="52" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="170" y="74" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">手机</text><text x="170" y="93" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">设备密钥 D 只在本机生成</text><line x1="600" y1="104" x2="600" y2="966" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="490" y="52" width="220" height="52" rx="8" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/><text x="600" y="74" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Relay（一个地址）</text><text x="600" y="93" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">只转发字节 + 内存路由</text><line x1="1030" y1="104" x2="1030" y2="966" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="920" y="52" width="220" height="52" rx="8" fill="#e7f6ec" stroke="#2f8f4e" stroke-width="1.5"/><text x="1030" y="74" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Mac（Alice 已登录）</text><text x="1030" y="93" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">身份密钥 K · 持久授权</text><rect x="20" y="126" width="1160" height="26" rx="4" fill="#eef2f7"/><text x="32" y="144" font-size="13" font-weight="700" fill="#111827" text-anchor="start">0  外层接入（Baton 启动后一直保持）：保证只有获准的 Baton 能在 Relay 上登记路由</text><text x="815" y="170" font-size="12.5" font-weight="600" fill="#2f8f4e" text-anchor="middle">外层 TLS → relay.example.com（Mac 按公共 CA 验 Relay）</text><text x="815" y="187" font-size="12.5" font-weight="400" fill="#2f8f4e" text-anchor="middle">客户端证书 = Mac 身份密钥 K → Relay 查只读允许名单</text><line x1="1030" y1="196" x2="602" y2="196" stroke="#2f8f4e" stroke-width="1.8" marker-end="url(#arrowGreen)"/><circle cx="582" cy="196" r="10" fill="#2f8f4e"/><text x="582" y="200" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="20" y="216" width="1160" height="26" rx="4" fill="#e7f6ec"/><text x="32" y="234" font-size="13" font-weight="700" fill="#111827" text-anchor="start">A  发起：Alice 已在 Mac 登录，点「添加手机」——之后全自动</text><rect x="621.25" y="256" width="558.75" height="46" rx="6" fill="#e7f6ec" stroke="#2f8f4e"/><text x="900.625" y="272" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">生成一次性邀请：路由号 r · Mac 指纹 fp = SHA-256(K 公钥) · 凭据 t（256 位随机）</text><text x="900.625" y="290" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">baton://pair?relay=relay.example.com&amp;r=…&amp;fp=…&amp;t=…    10 分钟 · 只能兑换一次</text><text x="815" y="320" font-size="12.5" font-weight="600" fill="#2f8f4e" text-anchor="middle">登记临时路由 r → 本 Mac（Relay 只拿到 r，拿不到 t 和私钥）</text><line x1="1030" y1="329" x2="602" y2="329" stroke="#2f8f4e" stroke-width="1.8" marker-end="url(#arrowGreen)"/><circle cx="582" cy="329" r="10" fill="#2f8f4e"/><text x="582" y="333" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="20" y="349" width="1160" height="26" rx="4" fill="#fff4e5"/><text x="32" y="367" font-size="13" font-weight="700" fill="#111827" text-anchor="start">B  内层端到端 TLS：在 Relay 转发的字节流里，手机与 Mac 直接握手</text><text x="385" y="393" font-size="12.5" font-weight="600" fill="#374151" text-anchor="middle">扫码 或 手输同一地址；手机生成设备密钥 D（钥匙串）</text><text x="385" y="410" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">外层 TLS → Relay（公共 CA），请求打开路由 r</text><line x1="170" y1="419" x2="598" y2="419" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/><circle cx="152" cy="419" r="10" fill="#374151"/><text x="152" y="423" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="815" y="445" font-size="12.5" font-weight="600" fill="#3b6fd8" text-anchor="middle">按 r 原样转发字节；r 未登记 / 过期 / 已用 → 拒绝</text><line x1="600" y1="454" x2="1028" y2="454" stroke="#3b6fd8" stroke-width="1.8" marker-end="url(#arrowBlue)"/><circle cx="582" cy="454" r="10" fill="#3b6fd8"/><text x="582" y="458" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="776.75" y="476" width="403.25" height="64" rx="6" fill="#fff4e5" stroke="#c26a12"/><text x="978.375" y="492" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">内层 TLS 1.3（双向证书），Relay 只看到密文：</text><text x="978.375" y="510" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">手机核对 Mac 证书指纹 = fp → 确认对端是签发邀请的那台 Mac</text><text x="978.375" y="528" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">Mac 收到手机证书 → 握手本身证明手机持有 D 的私钥</text><rect x="20" y="552" width="1160" height="26" rx="4" fill="#e8f0fe"/><text x="32" y="570" font-size="13" font-weight="700" fill="#111827" text-anchor="start">C  兑换与建通道（在内层连接里）</text><text x="600" y="596" font-size="12.5" font-weight="600" fill="#374151" text-anchor="middle">REDEEM t（只在内层加密里传输）</text><line x1="170" y1="605" x2="1028" y2="605" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/><circle cx="152" cy="605" r="10" fill="#374151"/><text x="152" y="609" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><rect x="668" y="627" width="512" height="46" rx="6" fill="#e7f6ec" stroke="#2f8f4e"/><text x="924" y="643" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">原子消费邀请：t 正确 · 未过期 · 未使用 · 签发账号仍有效 → 立即作废</text><text x="924" y="661" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">持久保存通道 c = { 账号 Alice, 设备公钥 D, Relay, 时间 }；撤销 r，登记 c</text><text x="600" y="691" font-size="12.5" font-weight="600" fill="#2f8f4e" text-anchor="middle">返回通道 c + 会话 → 手机直接以 Alice 身份进入</text><line x1="1030" y1="700" x2="172" y2="700" stroke="#2f8f4e" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrowGreen)"/><circle cx="152" cy="700" r="10" fill="#2f8f4e"/><text x="152" y="704" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">6</text><rect x="20" y="720" width="1160" height="26" rx="4" fill="#eef2f7"/><text x="32" y="738" font-size="13" font-weight="700" fill="#111827" text-anchor="start">D  之后每次打开 App：同样的内层 TLS，不再需要邀请</text><text x="600" y="764" font-size="12.5" font-weight="600" fill="#374151" text-anchor="middle">经 Relay 打开 c → 内层 TLS：核对 fp + 出示 D</text><text x="600" y="781" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">Mac 查 c 的记录里设备公钥 = D ✓ → 会话、API、事件流全在内层</text><line x1="170" y1="790" x2="1028" y2="790" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/><circle cx="152" cy="790" r="10" fill="#374151"/><text x="152" y="794" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">7</text><rect x="20" y="816" width="1160" height="86" rx="6" fill="#fdecec" stroke="#c0392b"/><text x="36" y="838" font-size="13" font-weight="700" fill="#c0392b" text-anchor="start">✕ 失败即停止，不建立通道：</text><text x="36" y="860" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">伪造 / 过期 / 已用的 r → Relay 拒绝 · 对端指纹 ≠ fp（假 Mac 或 Relay 中间人）→ 手机中止 · t 随机伪造 / 过期 / 重放 → Mac 拒绝</text><text x="36" y="880" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">只知道 c、没有设备私钥 D → 内层握手失败 · 撤销通道后，旧手机的 D 不再被接受</text><rect x="20" y="914" width="1160" height="50" rx="6" fill="#fffbe6" stroke="#b8a03a"/><text x="36" y="934" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">边界：首次配对时 Mac 还不认识这台手机，完整的有效链接就是授权依据。链接在兑换前泄露，先兑换的设备会成功；</text><text x="36" y="954" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">系统无法识别「哪一台实体手机」。缓解：10 分钟、单次、Mac 显示「已添加 iPhone · 时间」并可一键撤销。</text>
</svg>
